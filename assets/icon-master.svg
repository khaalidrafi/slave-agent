<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The product's own mark: a collar. A ring with one point facing
       forward — a servant agent that leads by serving. Gold on
       transparent; regenerate every flavor via
       scripts/generate_icons.py. Replaces the upstream caduceus
       (FORK.org own-mark decision, closed 2026-11-17). -->
  <g fill="none" stroke="#CD7F32" stroke-linejoin="round" stroke-linecap="round">
    <!-- the ring, broken where the point carries it forward -->
    <path d="M 24 64 A 40 40 0 1 0 64 24"
          stroke-width="10"/>
    <!-- the point: forward and slightly up -->
    <path d="M 64 24 L 104 40 L 64 44 Z"
          stroke-width="8"/>
  </g>
</svg>
