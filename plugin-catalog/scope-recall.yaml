subdir: distribution/slave
title: Scope Recall
description: "Local, source-backed long-term memory: recalls what you told an agent in your own words, with when you said it, keeps earlier versions as history when you change your mind, and shares one store with your other agents (other slave-agent profiles, Codex, Claude Code). Disclosure — captured messages, assistant replies and tool results are kept in a local SQLite store under ~/.scope-recall/shared, outside the slave-agent home and shared by every slave-agent profile and other agent (Codex, Claude Code) you attach to it; it makes no network calls by default; if you configure a model or embedding route, message excerpts go to that endpoint within the budget you set; keys are read only through slave-agent’s secret routes; it starts short detached background worker processes that inherit slave-agent’s environment; setup sets memory.provider in config.yaml and installs two skills (scope-recall-setup, scope-recall-memory) into your slave-agent skills folder."
maintainer: "c410979729-bit"
tier: community
category: memory
requires_hermes: ">=0.22.5"
version: "4.0.4"
docs_url: https://github.com/c410979729-bit/scope-recall-slave/blob/6c49a94cb08f63fc89cc46b17faf6aa5c02ea235/docs/install/slave.md
readme: true
platforms: [linux, macos, windows]
