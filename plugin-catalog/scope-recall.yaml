  - recall
  - inspect
  - trace
  - profile
  - entity
  - revise
  - forget
  - status
  - handoff_write
  - handoff_list
  - handoff_accept
  - handoff_cancel
  provides_hooks:
  - pre_llm_call
  - api_request_error
  - post_tool_call
  - post_llm_call
  provides_middleware: []
  requires_env: []
