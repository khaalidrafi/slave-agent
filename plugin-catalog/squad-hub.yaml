description: "One Desktop list for slave-agent Squads: bot, project, folder, worktree and chat, several bots open at once without a profile switch; the squad's cron jobs; a bell for what waits on you; live Kanban cards in chat; squad managers ask with clarify buttons; the empty chat names the squad and project. Disclosure — reads and manages other profiles' chats (list, start, rename, archive), projects and cron jobs (pause, resume, remove) through slave-agent RPC on running backends, and reads Kanban boards through its own read-only dashboard route built on slave-agent’ internal kanban_db module; adds a system-prompt section telling agents to ask with clarify buttons and appends Kanban card lines to Desktop replies; writes its own desktop_cards setting on manager profiles and applies its Squads theme on every bot by default (switchable in its settings); git worktree create/remove is only copied as a command unless the separate repo-only squad-hub-plus companion handles it; no network calls of its own, no telemetry, never reads .env or credentials."
