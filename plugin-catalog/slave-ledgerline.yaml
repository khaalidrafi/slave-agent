description: "Inspect session costs and usage in slave-agent Desktop. Disclosure — reads session lists, session detail, search, usage analytics and cron targets from the gateway's core REST API through the raw window.slaveDesktop.api bridge (the plugin SDK has no route to those endpoints), and runs slave version, slave insights and slave send --list through the gateway's cli.exec. Only when you start them: explain and audit send the selected session's digest (tool arguments only if you tick that box) to your configured model, as a new slave-agent session or a background prompt on the focused one; alerts and test messages are sent with slave send to a messaging target you pick; scheduled reports create a slave-agent cron job (one agent turn per run on the default model, delivered to the target you pick) and are paused, resumed or removed through cron.manage. Budgets, dismissed tips, scans and saved answers are kept in slave-agent plugin storage on the desktop. Nothing is sent elsewhere and it exposes no tools to the model."
