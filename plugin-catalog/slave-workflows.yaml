# no-tmp: ok — risk disclosure quoting the plugin's own handoff-file path, not a path slave-agent writes
description: "Agent-owned workflow graphs for slave-agent — a background runner executes a JSON DAG of agent nodes, fan-outs (quorum) and human/machine gates with fingerprint replay-skip resume, cooperative steer, typed failure events and compact status payloads; ships a desktop DAG view, an inline transcript card and the authoring skill with measured budget recipes. Stock slave-agent; no patched core required. Disclosure — every workflow run spawns a detached background runner (wf.py run <id>) that survives session end, gateway restart and plugin disable until the graph reaches a boundary or workflow stop; each agent node is a child slave chat --query-file … --oneshot -Q … inheriting the runner's environment, and a node with profile set runs as that named profile (with its own credentials) only if the target's workflow_team.json lists the launcher; a gate's wait.until_argv runs an agent-authored argv directly from the runner, outside slave-agent’ tool-approval gate (the engine uses no shell, but the shipped machine-watch and incident-response templates use it to run a shell line read from a /tmp handoff file); run and amend send a one-token ping through slave-agent’ configured providers to check pinned model routes; the runner reads state.db read-only; state lives under $SLAVE_HOME/workflows/ (or a configured runs_root). No scheduler, credential-store access or network of its own."
