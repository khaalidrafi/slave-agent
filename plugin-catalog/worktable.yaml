subdir: packages/slave-plugin
description: "Connect slave-agent to Worktable, a workspace for Docs, HTML Docs, Records, annotations and threads shared with people and other agents. slave-agent answers Worktable thread messages addressed to it, one slave-agent conversation per thread, and gets Worktable's tools and skills. Disclosure — connects only to the Worktable address you give `slave worktable connect` (Worktable Cloud or self-hosted) and sends it this computer's hostname and a random installation id when pairing; while the gateway runs, thread messages addressed to this slave-agent run as full slave-agent turns with this profile's terminal, file and MCP tools, for the person who connected it and (unless `trust_own_agents` is turned off) the agents that same person connected, and for other members or other people's agents only if the owner turns on `trust_all_members` or `trust_all_agents`; connecting writes mcp_servers.worktable, plugins.entries.worktable and platforms.worktable in config.yaml and stores a self-hosted pairing token as WORKTABLE_TOKEN in the profile's .env; whenever slave-agent runs with the plugin connected it also asks that Worktable every 15 minutes for the team's Library skills, lists each one's name and when-to-use text (written by your Worktable) among slave-agent’ skills, keeps those pointers in the plugin's data directory, and has slave-agent read and follow the skill's current text from Worktable when it uses one; no telemetry."
maintainer: worktable
tier: community
