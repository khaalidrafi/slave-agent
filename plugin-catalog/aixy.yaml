title: Aixy
description: >-
  Run slave-agent on Aixy: guided setup picks a model from your project's catalog, and optional MCP
  tools connect through browser OAuth, off by default.
  Disclosure — exposes CLI commands only, with no automatic hooks or runtime tools. Explicit
  inference setup sends the project key in an authenticated GET /models to the configured Aixy
  gateway (https://api.aixy-gateway.com/v1 by default), rejects redirects, and asks before
  updating the selected slave-agent profile's provider and main model settings. The key is stored
  through slave-agent’ credential writer as AIXY_API_KEY; provider settings contain a variable
  reference. Model requests send slave-agent’ opaque conversation scope in X-Aixy-Session-ID for
  grouping in Aixy Activity. No inference requests are sent during setup. Optional MCP setup starts the
  installed slave-agent CLI as a child process for browser OAuth, credential storage and tool
  selection against the independent MCP endpoint (https://api.aixy-gateway.com/mcp by default).
  The child uses the selected profile, disables inherited unattended and YOLO flags, and
  receives no key in command arguments. Setup requires an interactive terminal. No additional
  dependencies, telemetry, persistent background processes or self-updater.
