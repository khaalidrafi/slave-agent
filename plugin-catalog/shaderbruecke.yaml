name: shaderbruecke
title: Shaderbrücke
repo: https://github.com/studioluftbruecke/slave-shaderbruecke
sha: 51fd3176aa0fa35a1f4ae9c7f31335813a33d3ea
description: >-
  Make GLSL shaders with your slave-agent, see them render, tune them by hand, and take them into
  the tool you ship in, with a frame-by-frame proof on every export. Disclosure: each render starts
  a headless Chromium child on the slave-agent host with the network blocked; no network calls, no
  telemetry, no credentials.
maintainer: studioluftbruecke
tier: community
category: desktop
requires_hermes: ">=0.23.0"
docs_url: https://shaderbruecke.luftbruecke.studio
version: "0.2.6"
image: https://raw.githubusercontent.com/studioluftbruecke/slave-shaderbruecke/51fd3176aa0fa35a1f4ae9c7f31335813a33d3ea/docs/banner.png
screenshots:
  - https://raw.githubusercontent.com/studioluftbruecke/slave-shaderbruecke/51fd3176aa0fa35a1f4ae9c7f31335813a33d3ea/docs/screenshot-1.png
  - https://raw.githubusercontent.com/studioluftbruecke/slave-shaderbruecke/51fd3176aa0fa35a1f4ae9c7f31335813a33d3ea/docs/screenshot-2.png
  - https://raw.githubusercontent.com/studioluftbruecke/slave-shaderbruecke/51fd3176aa0fa35a1f4ae9c7f31335813a33d3ea/docs/screenshot-3.png
  - https://raw.githubusercontent.com/studioluftbruecke/slave-shaderbruecke/51fd3176aa0fa35a1f4ae9c7f31335813a33d3ea/docs/screenshot-4.png
  - https://raw.githubusercontent.com/studioluftbruecke/slave-shaderbruecke/51fd3176aa0fa35a1f4ae9c7f31335813a33d3ea/docs/screenshot-5.png
readme: true
platforms: [linux, macos]
known_issues:
  - "Renders need a Chromium on the slave-agent host (the slave-agent container image ships one); without it every render answers no_browser."
  - "With slave-agent on a server, install the plugin on the Desktop computer too, on the same version: Desktop loads the card from its own computer."
capabilities:
  provides_tools:
    - shader_render
    - shader_library
    - shader_export
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
